services:
  - type: web
    name: stylesense-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: product-images
      - key: AMD_VISION_URL
        sync: false
      - key: AMD_AGENT_URL
        sync: false
      - key: AMD_CLIP_URL
        sync: false
      - key: AMD_VLLM_API_KEY
        value: token-amd-hackathon
      - key: MODEL_VISION
        value: Qwen/Qwen2.5-VL-72B-Instruct-AWQ
      - key: MODEL_AGENT
        value: Qwen/Qwen2.5-72B-Instruct-AWQ
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMBEDDING_DIM
        value: "512"
      - key: IMAGE_WEIGHT
        value: "0.6"
      - key: TEXT_WEIGHT
        value: "0.4"
      - key: ENVIRONMENT
        value: production
